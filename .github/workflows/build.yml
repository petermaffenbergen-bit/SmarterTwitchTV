name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SmarterTwitchTV
      - uses: actions/checkout@v4
        with:
          repository: fgl27/media
          ref: release
          path: media
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android-Lizenzen bestaetigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: APK bauen
        working-directory: SmarterTwitchTV/apk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmarterTwitchTV
          path: SmarterTwitchTV/apk/app/build/outputs/apk/debug/*.apk
