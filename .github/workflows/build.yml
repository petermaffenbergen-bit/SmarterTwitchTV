name: Build APK
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      neu: ${{ steps.check.outputs.neu }}
      tag: ${{ steps.check.outputs.tag }}
      up: ${{ steps.check.outputs.up }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: meinfork
      - uses: actions/checkout@v4
        with:
          repository: YofarDev/SmarterPurpleTV
          path: SmarterTwitchTV
      - name: Neue Version pruefen
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(git -C SmarterTwitchTV rev-parse --short HEAD)
          MEIN=$(git -C meinfork rev-parse --short HEAD)
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y.%m.%d.%H%M)-$UP-$MEIN" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && gh release list --repo "$GITHUB_REPOSITORY" --limit 50 | grep -q -- "-$UP-$MEIN"; then
            echo "Keine Aenderungen, nichts zu tun."
            echo "neu=nein" >> "$GITHUB_OUTPUT"
          else
            echo "neu=ja" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.neu == 'ja'
        with:
          repository: fgl27/media
          ref: release
          path: media
      - uses: actions/setup-node@v4
        if: steps.check.outputs.neu == 'ja'
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        if: steps.check.outputs.neu == 'ja'
        with:
          distribution: temurin
          java-version: '17'
      - name: Anpassen (Name, Deutsch, eigene Seite, Update-Pruefung)
        if: steps.check.outputs.neu == 'ja'
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ -z "$KEY" ]; then echo "::error::Secret DEBUG_KEYSTORE fehlt oder ist leer"; exit 1; fi
          printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/twitch.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/twitch.keystore" -storepass android -alias androiddebugkey | grep -q "D3:6D:28:49:C8:42:B1:2C:D0:D4:82:C2:2E:16:A2:8E:52:7B:A0:2C:4F:1B:F4:65:E7:8E:E4:38:F5:DF:B2:51" || { echo "::error::Schluessel im Secret ist nicht der erwartete"; exit 1; }
          APP=SmarterTwitchTV/apk/app/src/main
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Twitch</string>|' $APP/res/values*/strings.xml
          cp meinfork/selfupdate/SelfUpdater.java $APP/java/com/fgl27/twitch/SelfUpdater.java
          grep -q "super.onCreate(savedInstanceState);" $APP/java/com/fgl27/twitch/PlayerActivity.java
          sed -i '0,/super.onCreate(savedInstanceState);/s//super.onCreate(savedInstanceState);\n        SelfUpdater.checkLater(this);/' $APP/java/com/fgl27/twitch/PlayerActivity.java
          grep -q "SelfUpdater.checkLater(this);" $APP/java/com/fgl27/twitch/PlayerActivity.java
          mkdir -p $APP/assets
          echo "$GITHUB_REPOSITORY" > $APP/assets/selfupdate_repo.txt
          echo "${{ steps.check.outputs.tag }}" > $APP/assets/selfupdate_tag.txt
          node meinfork/deutsch/anpassen.js SmarterTwitchTV "$GITHUB_REPOSITORY"
          node meinfork/deutsch/make-de.js SmarterTwitchTV meinfork/deutsch/de.json
      - name: Oberflaeche bauen
        if: steps.check.outputs.neu == 'ja'
        working-directory: SmarterTwitchTV
        run: |
          set -e
          npm install --no-audit --no-fund
          node release/scripts/maker.js
          grep -q "Erneut versuchen" release/githubio/js/main.js
          grep -q "$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr 'A-Z' 'a-z').github.io" release/githubio/js/main.js
      - name: APK bauen
        if: steps.check.outputs.neu == 'ja'
        working-directory: SmarterTwitchTV/apk
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/twitch.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -p "$APK" 'META-INF/*.RSA' | openssl pkcs7 -inform DER -print_certs | openssl x509 -noout -fingerprint -sha256 | tee /dev/stderr | grep -q "D3:6D:28:49:C8:42:B1:2C" || { echo "::error::APK ist nicht mit dem festen Schluessel signiert"; exit 1; }
      - name: Seite zusammenstellen
        if: steps.check.outputs.neu == 'ja'
        run: |
          mkdir _site
          rsync -a --exclude node_modules --exclude .git --exclude 'apk/app/build' --exclude 'apk/.gradle' --exclude 'apk/build' SmarterTwitchTV/ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.neu == 'ja'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.neu == 'ja'
        with:
          name: Twitch
          path: SmarterTwitchTV/apk/app/build/outputs/apk/debug/*.apk
  deploy:
    needs: build
    if: needs.build.outputs.neu == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: Twitch
          path: apk
      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/*.apk Twitch.apk
          gh release create "${{ needs.build.outputs.tag }}" Twitch.apk --repo "$GITHUB_REPOSITORY" --title "Twitch ${{ needs.build.outputs.tag }}" --notes "Gebaut aus YofarDev/SmarterPurpleTV (Stand ${{ needs.build.outputs.up }}), mit deutscher Oberflaeche" --latest
